[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-mantra-backend"
version = "1.0.0"
description = "Production FastAPI Backend for Skill Mantra Academy / Skill Thinker Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0,<=0.136.0",
    "pydantic>=2.10.0,<=2.13.0",
    "pydantic-settings>=2.6.0,<=2.16.0",
    "uvicorn[standard]>=0.32.0,<=0.42.0",
    "sqlalchemy>=2.0.35,<=2.1.0",
    "psycopg[binary]>=3.2.0,<=3.4.0",
    "alembic>=1.14.0,<=1.19.0",
    "argon2-cffi>=23.1.0,<=26.0.0",
    "bcrypt>=4.2.0,<=5.1.0",
    "email-validator>=2.2.0,<3.0.0",
    "reportlab>=4.4.0,<5.0.0",
    "python-dotenv>=1.0.1,<=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
